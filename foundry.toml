[profile.default]
src = "src"
# Named forge-out rather than the default out, because Next.js writes its static
# export to out/ and would otherwise overwrite the compiled contract artifacts.
out = "forge-out"
libs = ["lib"]
# Smaller bytecode and cheaper transactions for the farmers and investors who pay the gas.
optimizer = true
optimizer_runs = 200
# Deploy scripts read the Chainlink Functions JavaScript to install it on the feeder.
fs_permissions = [{ access = "read", path = "./scripts/functions" }]
remappings=["@openzeppelin/contracts=lib/openzeppelin-contracts/contracts", '@chainlink/contracts/=lib/chainlink-evm/contracts/']

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
