name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # Unit, fuzz and integration suites all run on a local EVM, so no RPC
      # endpoint or fork URL is needed.
      - name: Test
        run: forge test -vvv

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # ABIs are generated from build artifacts rather than committed, so the
      # contracts must be compiled before the frontend can typecheck.
      - name: Build contracts and generate ABIs
        run: |
          forge build
          node scripts/generate-abis.mjs

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts and generate ABIs
        run: |
          forge build
          node scripts/generate-abis.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # A local chain means the suite needs no RPC provider and no funded key.
      - name: Start anvil
        run: anvil --silent &

      # The demo contracts the journeys run against. Anvil account #4 stands in for the
      # verifier Safe; the farmer and investor are the accounts e2e/fixtures/mockWallet.ts uses.
      - name: Deploy the demo to anvil
        run: |
          for i in $(seq 1 30); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 1; done
          forge script script/DeployDemo.s.sol:DeployDemo \
            --rpc-url http://127.0.0.1:8545 \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --broadcast --slow
        env:
          VERIFIER_ADDRESS: "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
          DEMO_FARMER: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
          DEMO_INVESTOR: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"

      - name: Run Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
